<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Coffee Break</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f0e8;
            color: #333;
        }
        header {
            background-color: #3c4b38;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            color: #3c4b38;
        }
        .menu-section {
            margin-bottom: 30px;
        }
        .menu-section h3 {
            border-bottom: 2px solid #3c4b38;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        footer {
            background-color: #3c4b38;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>COFFEE BREAK</h1>
    </header>
    <main>
        <h2>Menu</h2>
        <div class="menu-section">
            <h3>Sweets</h3>
            <div class="menu-item">
                <span>Brownie</span>
                <span>$160</span>
            </div>
            <div class="menu-item">
                <span>Cake Slice</span>
                <span>$130</span>
            </div>
            <div class="menu-item">
                <span>Scons</span>
                <span>$60</span>
            </div>
            <div class="menu-item">
                <span>Muffins</span>
                <span>$100</span>
            </div>
            <div class="menu-item">
                <span>Cookies</span>
                <span>$70</span>
            </div>
        </div>
        <div class="menu-section">
            <h3>Salty</h3>
            <div class="menu-item">
                <span>Hot Sandwiches</span>
                <span>$180</span>
            </div>
        </div>
        <div class="menu-section">
            <h3>Drinks</h3>
            <div class="menu-item">
                <span>Coffee</span>
                <span>$100</span>
            </div>
            <div class="menu-item">
                 <span>Cappuccino</span>
                 <span>$140</span>
        </div>
            <div class="menu-item">
                <span>Smoothie</span>
                <span>$130</span>
            </div>
            <div class="menu-item">
                <span>Juice (orange, lemonade)</span>
                <span>$130</span>
            </div>
        </div>
    </main>
    <footer>
        &copy; 2025 Coffee Break. Todos los derechos reservados.
    </footer>
</body>
</html>
